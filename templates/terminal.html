<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='terminal_icon.ico') }}" type="image/x-icon">
    <title>neural.py · estetica</title>

    <style>
        :root {
            --bg: #050607;
            --phosphor: #46ff8a;
            --dim: #1f6b3f;
            --faint: #6b8f7c;
            --class-a: #46ff8a;
            --class-b: #ffb266;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: var(--bg);
            color: var(--phosphor);
            font-family: 'Courier New', 'Liberation Mono', monospace;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Scanlines finas + viñeta: el look CRT sin ensuciar */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.16) 0px,
                    rgba(0, 0, 0, 0.16) 1px,
                    transparent 1px,
                    transparent 3px
                ),
                radial-gradient(ellipse at center, transparent 52%,
                                rgba(0, 0, 0, 0.55) 100%);
            z-index: 2;
        }

        .back {
            position: fixed;
            top: 18px;
            left: 22px;
            z-index: 3;
            color: var(--faint);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.04em;
            transition: color 0.2s ease;
        }

        .back:hover { color: var(--phosphor); }

        main {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            padding: 0 12px;
            z-index: 1;
        }

        /* Halo tenue detrás del arte: da profundidad al fósforo */
        main::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                                        rgba(70, 255, 138, 0.055), transparent 62%);
        }

        #replay {
            position: relative;
            margin: 0;
            line-height: 1;
            white-space: pre;
            color: var(--phosphor);
            text-shadow: 0 0 7px rgba(70, 255, 138, 0.28);
            /* fade del bucle: al final el arte se apaga y vuelve a nacer */
            transition: opacity 0.45s ease;
        }

        /* Niveles del mapa de decisión: del halo lejano al borde */
        #replay .l1 { color: rgba(70, 255, 138, 0.10); }
        #replay .l2 { color: rgba(70, 255, 138, 0.16); }
        #replay .l3 { color: rgba(70, 255, 138, 0.24); }
        #replay .l4 { color: rgba(70, 255, 138, 0.34); }
        #replay .l5 { color: rgba(70, 255, 138, 0.46); }
        #replay .l6 { color: rgba(70, 255, 138, 0.60); }
        #replay .l7 { color: rgba(70, 255, 138, 0.74); }
        #replay .l8 { color: rgba(70, 255, 138, 0.88); }
        #replay .l9 { color: #9dffc4; }

        /* Los dos puntos del dataset y el resto del dashboard */
        #replay .p0 { color: var(--class-a); text-shadow: 0 0 8px rgba(70, 255, 138, 0.7); }
        #replay .p1 { color: var(--class-b); text-shadow: 0 0 8px rgba(255, 178, 102, 0.65); }

        footer {
            padding: 0 22px 16px;
            font-size: 12px;
            line-height: 1.6;
            color: var(--faint);
            z-index: 1;
            overflow-wrap: anywhere;
        }

        footer .cmd { color: var(--dim); }
        footer a { color: var(--dim); text-decoration: none; }
        footer a:hover { color: var(--phosphor); }

        @media screen and (max-width: 760px) {
            .back { top: 12px; left: 14px; font-size: 12px; }
            footer { padding: 0 14px 12px; font-size: 10px; }
        }
    </style>
</head>

<body>
    <a href="{{ url_for('index') }}" class="back">← blog</a>

    <main>
        <pre id="replay" aria-label="Entrenamiento de una red neuronal dibujado en ASCII"></pre>
    </main>

    <footer>
        <div class="cmd">jose@estetica:~$ python3 neural.py --epochs 300</div>
        <div>
            # mlp 2-16-1 · 65 params · adam · espiral de 2 brazos ·
            mismo código en tu terminal:
            <a href="{{ url_for('static', filename='neural.py') }}">curl -fsSL
                {{ request.host }}/static/neural.py</a> | python3
        </div>
        <noscript><div># necesitas JavaScript para reproducir el entrenamiento</div></noscript>
    </footer>

    <script>
        const replay = document.getElementById('replay');
        const RAMP = ' .:-=+*#%@';

        // El JSON lo genera static/neural.py --web: metadatos + frames en
        // zlib+base64. Se elige la rejilla según el viewport.
        async function loadReplay(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(url + ' -> ' + res.status);
            const doc = await res.json();
            if (typeof DecompressionStream === 'undefined') {
                throw new Error('este navegador no soporta DecompressionStream');
            }
            const bytes = Uint8Array.from(atob(doc.data), c => c.charCodeAt(0));
            const stream = new Blob([bytes]).stream()
                .pipeThrough(new DecompressionStream('deflate'));
            return { doc, frames: JSON.parse(await new Response(stream).text()) };
        }

        // Los frames son texto plano: el color sale de cada carácter. 'o' y
        // 'x' son los dos puntos del dataset; el resto es la rampa del mapa
        // de decisión (espacio = lejos del borde, '@' = justo en el borde).
        // Se agrupan caracteres consecutivos del mismo color en un <span>
        // para no crear miles de nodos por frame.
        function toHTML(frame) {
            let out = '', cls = null, buf = '';
            const flush = () => {
                if (buf) out += '<span class="' + cls + '">' + buf + '</span>';
                buf = '';
            };
            for (const ch of frame) {
                let c;
                if (ch === '\n') { c = null; }
                else if (ch === 'o') { c = 'p0'; }
                else if (ch === 'x') { c = 'p1'; }
                else {
                    const lv = RAMP.indexOf(ch);
                    c = lv > 0 ? 'l' + lv : 'l1';  // el espacio va como l1 (casi invisible)
                }
                if (c !== cls) { flush(); cls = c; }
                buf += ch === '&' ? '&amp;' : ch === '<' ? '&lt;'
                     : ch === '>' ? '&gt;' : ch;
            }
            flush();
            return out;
        }

        // El <pre> se escala para llenar el viewport sin deformar. Se mide el
        // ancho real de un carácter con la fuente del sistema (no todas las
        // monoespaciadas miden 0.6em) y se limita por ancho y por alto.
        function fit(cols, rows) {
            const main = document.querySelector('main');
            const probe = document.createElement('span');
            probe.textContent = '0'.repeat(cols);
            probe.style.cssText = 'position:absolute;visibility:hidden;' +
                                  'white-space:pre;font-size:100px;';
            document.body.appendChild(probe);
            const perCol = probe.getBoundingClientRect().width / cols / 100;
            probe.remove();

            const availW = main.clientWidth - 24;
            const availH = main.clientHeight - 24;
            replay.style.fontSize =
                Math.min(26, availW / (perCol * cols), availH / rows) + 'px';
        }

        async function start() {
            const small = window.matchMedia('(max-width: 760px)').matches;
            const url = small
                ? "{{ url_for('static', filename='data/neural-mobile.json') }}"
                : "{{ url_for('static', filename='data/neural-desktop.json') }}";
            try {
                const { doc, frames } = await loadReplay(url);
                const html = frames.map(toHTML);
                fit(doc.cols, doc.rows);
                window.addEventListener('resize', () => fit(doc.cols, doc.rows));

                const fadeAt = Math.max(1, html.length - 4);
                let i = 0;
                replay.innerHTML = html[0];
                setInterval(() => {
                    if (i === fadeAt) replay.style.opacity = '0';
                    i = (i + 1) % html.length;
                    if (i === 0) replay.style.opacity = '1';
                    replay.innerHTML = html[i];
                }, 1000 / doc.fps);
            } catch (e) {
                replay.textContent = '> replay no disponible: ' + e.message;
            }
        }

        start();
    </script>
</body>
</html>
